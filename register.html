<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hesab yarat - Cultra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0d111d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 28px 24px 32px;
      display: flex;
      flex-direction: column;
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #182033;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 20px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
      margin: 36px 0 10px;
    }

    .lead {
      color: #71809f;
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 28px;
    }

    label {
      display: block;
      color: #8491ad;
      font-size: 14px;
      margin: 0 0 8px 4px;
    }

    input {
      width: 100%;
      height: 56px;
      background-color: #182033;
      border: 1px solid #30394c;
      border-radius: 18px;
      color: white;
      font-size: 16px;
      font-family: inherit;
      padding: 0 18px;
      margin-bottom: 18px;
    }

    input::placeholder {
      color: #596987;
    }

    input:focus {
      outline: none;
      border-color: #f79432;
    }

    .btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 18px;
      background-color: #f79432;
      color: #0d111d;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn:focus-visible {
      outline: 2px solid #f79432;
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .message {
      min-height: 22px;
      margin: 14px 4px 0;
      font-size: 14px;
      color: #ff7a6b;
    }

    .message.ok {
      color: #3fc08d;
    }

    .switch {
      margin-top: auto;
      padding-top: 28px;
      text-align: center;
      color: #71809f;
      font-size: 15px;
    }

    .switch a {
      color: #f79432;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
    <script src="config.js"></script>
</head>

<body>
  <main class="page">

    <a class="back" href="先.html" aria-label="Geri">←</a>

    <h1>Hesab yarat</h1>
    <p class="lead">İstifadəçi adınızı və parolunuzu daxil edin</p>

    <form id="register-form">
      <label for="username">İstifadəçi adı</label>
      <input id="username" placeholder="3-20 simvol" autocomplete="username" required />

      <label for="password">Parol</label>
      <input id="password" type="password" placeholder="Minimum 8 simvol" autocomplete="new-password" minlength="8" required />

      <button class="btn" id="submit" type="submit">Hesab yarat</button>

      <p class="message" id="result" role="status"></p>
    </form>

    <p class="switch">Artıq hesabınız var? <a href="login.html">Daxil ol</a></p>

  </main>

  <script>
    const form = document.getElementById("register-form");
    const result = document.getElementById("result");
    const submit = document.getElementById("submit");

    function show(text, ok) {
      result.innerText = text;
      result.className = ok ? "message ok" : "message";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      submit.disabled = true;
      show("", false);

      try {
        // Send the data to FastAPI
        const response = await fetch(API + "/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        // Convert backend response from JSON into JavaScript data
        const data = await response.json();

        if (data.status === "success") {
          // Save the user so the other pages know who is logged in
          sessionStorage.setItem("user_id", data.user_id);

          show("Hesab yaradıldı", true);
          window.location.href = "main_menu.html";
        } else {
          show(data.reason || "Qeydiyyat alınmadı", false);
          submit.disabled = false;
        }

      } catch (error) {
        show("Serverə qoşulmaq olmur. Backend-in işlədiyini yoxlayın.", false);
        submit.disabled = false;
      }
    });
  </script>

</body>

</html>
