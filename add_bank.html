<!DOCTYPE html>
<html lang="az">

<head>
    <meta name="color-scheme" content="dark" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank kartı əlavə et - Cultra</title>

  <style>

    /* personal theme (default) */
    :root {
            color-scheme: dark;
      --bg: #0d111d;
      --card: #182033;
      --border: #30394c;
      --text: white;
      --text-2: #8491ad;
      --placeholder: #596987;
      --cultra-gold: #f79432;
      --cultra-gold-bright: #f79432;
    }

    /* merchant theme: add_bank.html?type=merchant */
    :root.merchant {
      --bg: #0d1016;
      --card: #181b22;
      --border: #353a43;
      --text: #f5f5f5;
      --text-2: #9299a8;
      --placeholder: rgba(146, 153, 168, 0.6);
      --cultra-gold: #d9a441;
      --cultra-gold-bright: #f0c35a;
    }
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 28px 24px 32px;
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 20px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
      margin: 36px 0 28px;
    }

    label {
      display: block;
      color: var(--text-2);
      font-size: 14px;
      margin: 0 0 8px 4px;
    }

    input {
      width: 100%;
      height: 56px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      padding: 0 18px;
      margin-bottom: 18px;
    }

    input::placeholder {
      color: var(--placeholder);
    }

    input:focus {
      outline: none;
      border-color: var(--cultra-gold-bright, #f0c35a);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row>div {
      flex: 1;
    }

    .btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 18px;
      background-color: var(--cultra-gold, #f79432);
      color: var(--bg);
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn:focus-visible {
      outline: 2px solid var(--cultra-gold, #f79432);
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .message {
      min-height: 22px;
      margin: 14px 4px 0;
      font-size: 14px;
      color: #ff7a6b;
    }

    .message.ok {
      color: #3fc08d;
    }
  </style>
  <script>
    if (new URLSearchParams(window.location.search).get("type") === "merchant") {
      document.documentElement.classList.add("merchant");
    }
  </script>
    <script src="config.js"></script>
</head>

<body>
  <main class="page">

    <a class="back" href="bank_cards.html" aria-label="Kartlarınıza qayıt">←</a>

    <h1>Bank kartı əlavə et</h1>

    <form id="card-form">
      <label for="bank_card">Kartın nömrəsi</label>
      <input id="bank_card" placeholder="16 rəqəm" maxlength="16" inputmode="numeric" autocomplete="cc-number" required />

      <div class="row">
        <div>
          <label for="bank_month">Ay</label>
          <input id="bank_month" placeholder="AA" maxlength="2" inputmode="numeric" autocomplete="cc-exp-month" required />
        </div>
        <div>
          <label for="bank_year">İl</label>
          <input id="bank_year" placeholder="İİ" maxlength="2" inputmode="numeric" autocomplete="cc-exp-year" required />
        </div>
        <div>
          <label for="bank_cvv">CVV</label>
          <input id="bank_cvv" type="password" placeholder="123" maxlength="3" inputmode="numeric" autocomplete="cc-csc" required />
        </div>
      </div>

      <button class="btn" id="submit" type="submit">Əlavə et</button>

      <p class="message" id="result" role="status"></p>
    </form>

  </main>

  <script>
    const user_id = sessionStorage.getItem("user_id");

    // Not logged in: go back to the welcome page
    if (!user_id) window.location.href = "先.html";

    // add_bank.html?type=merchant adds a MERCHANT bank account (where withdrawals go)
    const isMerchant = new URLSearchParams(window.location.search).get("type") === "merchant";
    const accountType = isMerchant ? "merchant" : "personal";
    const afterAddUrl = isMerchant ? "merchant_main_page.html" : "bank_cards.html";

    document.querySelector(".back").href = afterAddUrl;
    if (isMerchant) document.querySelector("h1").innerText = "Biznes bank hesabı əlavə et";

    const form = document.getElementById("card-form");
    const result = document.getElementById("result");
    const submit = document.getElementById("submit");

    function show(text, ok) {
      result.innerText = text;
      result.className = ok ? "message ok" : "message";
    }

    // Digits only
    form.querySelectorAll("input").forEach(function (input) {
      input.addEventListener("input", function () {
        input.value = input.value.replace(/\D/g, "");
      });
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      submit.disabled = true;
      show("", false);

      try {
        const response = await fetch(API + "/addbank", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_id: user_id,
            number: document.getElementById("bank_card").value,
            cvv: document.getElementById("bank_cvv").value,
            month: document.getElementById("bank_month").value,
            year: document.getElementById("bank_year").value,
            type: accountType
          })
        });

        const data = await response.json();

        if (data.status === "success") {
          show("Kart əlavə olundu", true);
          setTimeout(function () {
            window.location.href = afterAddUrl;
          }, 800);
        } else {
          show(data.reason || "Kartı əlavə etmək alınmadı", false);
          submit.disabled = false;
        }

      } catch (error) {
        show("Serverə qoşulmaq olmur. Backend-in işlədiyini yoxlayın.", false);
        submit.disabled = false;
      }
    });
  </script>

    <script>
      // The payment-approval popup is for personal mode only (merchant mode just receives)
      if (!isMerchant) {
        const popup = document.createElement("script");
        popup.src = "pending_requests.js";
        document.body.appendChild(popup);
      }
    </script>
</body>

</html>
