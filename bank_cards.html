<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank kartlarınız - Cultra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #0d111d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            padding: 28px 24px 32px;
            display: flex;
            flex-direction: column;
        }

        .back {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #182033;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 20px;
        }

        h1 {
            font-size: 32px;
            line-height: 1.15;
            margin: 36px 0 24px;
        }

        /* Card rows */

        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            background-color: #182033;
            border: 1px solid #30394c;
            border-left: 3px solid #f79432;
            border-radius: 22px;
            padding: 18px 20px;
            margin-bottom: 12px;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background-color: #171e30;
            border: 1px solid #2c3548;
            color: #f79432;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card-number {
            font-weight: bold;
            font-size: 17px;
        }

        .card-expiry {
            color: #61708d;
            font-size: 14px;
            margin-top: 4px;
        }

        /* Empty and error states */

        .empty {
            color: #71809f;
            line-height: 1.5;
            margin: 0;
        }

        .empty a {
            color: #f79432;
            font-weight: bold;
            text-decoration: none;
        }

        .error {
            color: #ff7a6b;
        }

        /* Add button */

        .btn {
            margin-top: auto;
            height: 56px;
            border: none;
            border-radius: 18px;
            background-color: #f79432;
            color: #0d111d;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }

        .btn:focus-visible {
            outline: 2px solid #f79432;
            outline-offset: 3px;
        }

        .spacer {
            margin-top: auto;
            padding-top: 24px;
        }

        .spacer .btn {
            width: 100%;
        }
    </style>
</head>

<body>
    <main class="page">

        <a class="back" href="main_menu.html" aria-label="Back to home">←</a>

        <h1>Bank kartlarınız</h1>

        <div id="accounts"></div>

        <div class="spacer">
            <button class="btn" onclick="window.location.href='add_bank.html'">Bank kartı əlavə et</button>
        </div>

    </main>

    <script>
        const accounts = document.getElementById("accounts");

        function message(html, isError) {
            accounts.innerHTML = '<p class="empty' + (isError ? " error" : "") + '">' + html + "</p>";
        }

        async function loadAccounts() {

            // Get the logged-in user's ID
            const user_id = sessionStorage.getItem("user_id");

            // Not logged in: go back to the welcome page
            if (!user_id) {
                window.location.href = "先.html";
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:8000/bankcards/" + user_id);
                const data = await response.json();

                if (data.status !== "success") {
                    message('Your session has expired. <a href="login.html">Log in again</a>', true);
                    return;
                }

                const numbers = Object.keys(data.accounts);

                if (numbers.length === 0) {
                    message("Kart mövcud deyil. İlk kartınızı əlavə edin.");
                    return;
                }

                accounts.innerHTML = "";

                for (const number of numbers) {
                    const info = data.accounts[number];

                    // Show only the last 4 digits
                    const lastFour = number.slice(-4);

                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML =
                        '<div class="card-icon">💳</div>' +
                        "<div>" +
                        '<div class="card-number">•••• •••• •••• ' + lastFour + "</div>" +
                        '<div class="card-balance">Balans: ' + info.balance + " Azn" + "</div>" +
                        "</div>";

                    accounts.appendChild(card);
                }

            } catch (error) {
                message("Can't reach the server. Check that the backend is running.", true);
            }
        }

        loadAccounts();
    </script>

    <script src="pending_requests.js"></script>
</body>

</html>
